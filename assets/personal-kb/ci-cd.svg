<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930" viewBox="0 0 1500 930"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#506c87"/></marker></defs><rect width="1500" height="930" fill="#f8fafc"/>
<text x="50" y="65" fill="#12304a" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700">Personal KB · CI / CD and retrieval evaluation</text>
<text x="50" y="103" fill="#536779" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400">GitHub Actions validates pull requests · AWS CodeBuild deploys an explicitly selected source commit</text>
<text x="50" y="155" fill="#2563a6" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700">01  PULL REQUEST · GITHUB ACTIONS</text>
<rect x="50" y="185" width="300" height="140" rx="14" fill="#edf3fa" stroke="#9ab3cd" stroke-width="2"/>
<text x="70" y="219" fill="#20517c" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">SpecKit + source change</text>
<text x="70" y="251" fill="#536779" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">Requirements, design and tasks</text>
<text x="70" y="277" fill="#536779" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">Reviewable code and IaC</text>
<rect x="420" y="185" width="430" height="140" rx="14" fill="#edf3fa" stroke="#9ab3cd" stroke-width="2"/>
<text x="440" y="219" fill="#20517c" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">Credential-free validation</text>
<text x="440" y="251" fill="#536779" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">CloudFormation lint + service tests</text>
<text x="440" y="277" fill="#536779" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">Synthetic auth, storage and retrieval checks</text>
<rect x="920" y="185" width="530" height="140" rx="14" fill="#edf3fa" stroke="#9ab3cd" stroke-width="2"/>
<text x="940" y="219" fill="#20517c" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">Review and merge</text>
<text x="940" y="251" fill="#536779" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">PR checks must pass</text>
<text x="940" y="277" fill="#536779" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400">AWS deployment through GHA is inactive</text>
