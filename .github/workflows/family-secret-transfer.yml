name: Move family deployment credential

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install credential-encryption library
        run: python3 -m pip install --disable-pip-version-check --quiet PyNaCl==1.6.0
      - name: Seal credential for the private family repository
        env:
          SOURCE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_DAWN_HILL }}
        shell: python
        run: |
          import base64, json, os
          from nacl.public import PublicKey, SealedBox
          value = os.environ.get('SOURCE_TOKEN', '')
          if not value:
              raise SystemExit('The source credential is missing.')
          key = PublicKey(base64.b64decode('bSMHdLCBHfiRkQH4n/Lou3ZmIaRwB6eVzZRa//FUkXA='))
          encrypted = SealedBox(key).encrypt(value.encode())
          with open('family-credential-sealed.json', 'w') as output:
              json.dump({'key_id': '3380204578043523366', 'encrypted_value': base64.b64encode(encrypted).decode()}, output)
          print('Credential sealed to the destination repository public key. Plaintext was not exported.')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: family-credential-sealed
          path: family-credential-sealed.json
          retention-days: 1
